services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      GROBID_URL: http://grobid:8070
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OUTPUT_DIR: /app/output
    volumes:
      - ./output:/app/output
      # Zotero (optional): uncomment and set your host Zotero path to index your library.
      # Otherwise use the "Upload PDFs" workflow. Set ZOTERO_DATA_DIR to /zotero in the UI/env.
      # - ${HOME}/Zotero:/zotero:ro
    depends_on:
      - grobid
      - qdrant
      - ollama

  grobid:
    image: grobid/grobid:0.9.0-crf  # lightweight CRF (~500MB); plain 0.9.0 is the ~10GB deep-learning image
    ports:
      - "8070:8070"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  ollama_data:
