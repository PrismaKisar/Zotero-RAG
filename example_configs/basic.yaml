# Basic: Zotero source, with every available option documented inline

# ============================================================================
# Zotero and Output Settings
# ============================================================================

# Path to Zotero data directory (optional - auto-detect if not provided)
# Example: /Users/username/Zotero
zotero_data_dir: null

# Name of the Zotero collection to use (optional - use entire library if not provided)
# Example: "Machine Learning Papers"
zotero_collection: null

# Base directory for all outputs (indexes, TEI cache, highlighted PDFs)
output_base_dir: ./output

# ============================================================================
# Model Settings
# ============================================================================

# The models themselves are fixed: the pipeline's thresholds are calibrated on
# them (zotero_rag/settings.py).

# Device to use: 'cpu', 'cuda', 'mps', or null for auto-detect
model_device: null

# Batch size for encoding embeddings (null = library default)
encode_batch_size: 32

# Batch size for reranking (null = library default)
rerank_batch_size: 32

# ============================================================================
# GROBID Settings (for PDF processing)
# ============================================================================

grobid_url: http://localhost:8070
grobid_timeout: 180

# ============================================================================
# Chunk Contextualization (Ollama)
# ============================================================================

# Prefix each chunk with an LLM-written context line before embedding. Off by
# default: no benchmark measured it. Indexing fails if Ollama does not answer.
use_chunk_contextualization: false
ollama_url: http://localhost:11434  # default: $OLLAMA_URL, else this

# ============================================================================
# Index Settings
# ============================================================================

# Force rebuild index even if it exists
# Index is automatically named based on collection and model
rebuild_index: false

# ============================================================================
# Default Settings for All Questions
# ============================================================================

defaults:
  # Default highlight color as RGB values (0-1)
  # Yellow: [1, 1, 0], Green: [0, 1, 0], Blue: [0, 0.5, 1], Pink: [1, 0, 1]
  highlight_color: [1, 1, 0]

# ============================================================================
# Questions to Answer
# ============================================================================

# Only the question and its highlight colour are set here: the retrieval,
# reranking and answering settings are fixed (zotero_rag/settings.py).
questions:
  # Example 1: Simple question with the default colour
  - question: "What are transformers?"

  # Example 2: Question with its own highlight color
  - question: "How does attention mechanism work?"
    highlight_color: [0, 1, 0]  # Green

  # Example 3: Another colour, so its highlights are told apart in the PDF
  - question: "What is the learning rate used?"
    highlight_color: [1, 0, 1]  # Pink

# ============================================================================
# Output Settings
# ============================================================================

# Create highlighted PDFs with answers marked
create_highlighted_pdfs: true

# Save results to JSON file (optional - set to null to disable)
results_file: results.json
